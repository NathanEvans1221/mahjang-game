<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻將網頁版</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="app">
        <header>
            <h1>🀄 麻將網頁版</h1>
            <div class="header-controls">
                <button id="btn-settings">設定</button>
                <button id="btn-new-game">新局</button>
            </div>
        </header>

        <main id="game-board">
            <div id="table-center">
                <span id="center-tiles"></span>
                <span id="center-turn"></span>
            </div>
            <!-- 遊戲牌桌會在這裡渲染 -->
        </main>

        <footer id="action-bar">
            <div id="score-bar"></div>
            <div class="action-buttons">
                <button id="btn-chow" class="action-btn" disabled>吃</button>
                <button id="btn-pong" class="action-btn" disabled>碰</button>
                <button id="btn-kong" class="action-btn" disabled>槓</button>
                <button id="btn-win" class="action-btn" disabled>胡</button>
            </div>
            <div class="game-info">
                <span id="tile-count">剩餘牌數: 0</span>
            </div>
        </footer>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title"></h2>
            <div id="modal-message"></div>
            <button id="modal-close">關閉</button>
        </div>
    </div>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content settings-content">
            <h2>設定</h2>
            <label class="settings-row">遊戲速度
                <select id="setting-speed">
                    <option value="slow">慢</option>
                    <option value="normal" selected>一般</option>
                    <option value="fast">快</option>
                </select>
            </label>
            <label class="settings-row"><input type="checkbox" id="setting-anim" checked> 啟用動畫</label>
            <button id="settings-close">關閉</button>
        </div>
    </div>

    <div id="loading-overlay" class="hidden">
        <div class="loading-spinner"></div>
        <div class="loading-text">電腦思考中...</div>
    </div>

    <!-- Templates -->
    <template id="tpl-player-area">
        <div class="player-area">
            <div class="player-name"></div>
            <div class="player-hand"></div>
            <div class="meld-area"></div>
            <div class="discard-pile"></div>
        </div>
    </template>

    <template id="tpl-tile">
        <div class="tile"></div>
    </template>

    <script type="module" src="js/app.js"></script>
</body>

</html>
